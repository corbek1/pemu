name: switch-release

on:
  workflow_dispatch:

jobs:
  build-switch-release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt -yq update
          sudo apt -yq install git build-essential cmake zip

      - name: Configure
        run: |
          cd $GITHUB_WORKSPACE
          mkdir cmake-build && cd cmake-build
          cmake -G "Unix Makefiles" -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pfbneo
        run: |
          cd $GITHUB_WORKSPACE/cmake-build
          make pfbneo.deps
          make pfbneo.nro
          mv src/cores/pfbneo/pfbneo.nro $GITHUB_WORKSPACE

      - name: Upload nro
        uses: actions/upload-artifact@v4
        with:
          name: pfbneo-nro
          path: pfbneo.nro
